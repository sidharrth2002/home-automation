<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070b">
  <title>Home</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grain"></i></div>

  <main class="hub" id="hub">
    <header class="top">
      <div class="greeting">
        <p class="eyebrow" id="date"></p>
        <h1><span id="hello">Hello</span>, <em>Sid</em></h1>
      </div>
      <div class="top-right">
        <div class="clock" id="clock">--:--</div>
        <div class="chips" id="chips"></div>
      </div>
    </header>

    <div class="stack">
      <section class="card room" id="room" aria-label="Lights"></section>
      <section class="scenes" id="scenes" aria-label="Scenes"></section>
    </div>
    <section class="card music" id="music" aria-label="Music sync"></section>
    <section class="card calendar" id="calendar" aria-label="Calendar"></section>
    <section class="card invest-card" id="invest" aria-label="Investments"></section>
    <section class="card cash-card" id="cash" aria-label="Cash"></section>
    <section class="card desk" id="desk" aria-label="Desk lamp"></section>
    <section class="card tv" id="tv" aria-label="TV"></section>
    <section class="card health-card" id="health" aria-label="System health"></section>

    <footer class="foot" id="foot"></footer>
  </main>

  <section class="ambient-screen" id="ambient" aria-hidden="true"></section>
  <dialog class="event" id="event" aria-label="Event details"></dialog>
  <dialog class="event holding-dlg" id="holding" aria-label="Holding details"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
