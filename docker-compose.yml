services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    volumes:
      - ./homeassistant/config:/config
    ports:
      - "8123:8123"

  # Logs, metrics and traces from every service (OpenTelemetry): Grafana with Loki, Prometheus and Tempo in one
  # container. Grafana: http://localhost:3000 (the "Home" dashboard). Only reachable from this machine.
  telemetry:
    image: grafana/otel-lgtm:0.11.0
    container_name: telemetry
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    volumes:
      - ./data/telemetry:/data
      - ./telemetry/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/home.yaml:ro
      - ./telemetry/grafana/home.json:/otel-lgtm/home-dashboards/home.json:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"

  # The way in from outside: an outbound-only Cloudflare Tunnel, so no router ports are opened and the home's IP
  # stays private. The tunnel's public hostname (home-server.<your domain>) points at http://homeassistant:8123 in
  # Cloudflare's dashboard, which works on both machines: here by the container's name, on the server through
  # docker-compose.server.yml's hosts entry. TUNNEL_TOKEN in .env; off until COMPOSE_PROFILES=tunnel.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on: [homeassistant]
    profiles: [tunnel]

  # Media: torrents into a library that streams to the TV. Off until COMPOSE_PROFILES includes media; set up with
  # `python -m media setup` (folders, passwords, qBittorrent's settings, Jellyfin's libraries). Both are LAN-only:
  # neither goes through the tunnel. The library is MEDIA_DIR (default data/media): Movies, Shows, downloads.
  #
  # qBittorrent: add a torrent or magnet link at http://<this machine>:8090 (phone or laptop); finished downloads
  # move into Movies or Shows by category, or stay in downloads/. 6881 is the port other peers reach it on.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - TZ=Europe/London
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - ./data/qbittorrent:/config
      - ${MEDIA_DIR:-./data/media}:/media
    ports:
      - "8090:8090"
      - "6881:6881"
      - "6881:6881/udp"
    profiles: [media]

  # Jellyfin: the library, streamed to the TV's Jellyfin app (and any browser: http://<this machine>:8096). It only
  # reads the library.
  jellyfin:
    image: jellyfin/jellyfin:10.10.3
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_DIR:-./data/media}:/media:ro
    ports:
      - "8096:8096"
    profiles: [media]
