# The server (the always-on Linux box) on top of docker-compose.yml. Its .env sets
#   COMPOSE_FILE=docker-compose.yml:docker-compose.server.yml
# so plain `docker compose` (and ./home) picks this up there; the Mac never reads it.
services:
  homeassistant:
    # On Linux, Home Assistant wants the host's network: discovery (WiZ bulbs, Cast, mDNS) needs broadcasts that a
    # bridged container doesn't see. Docker Desktop on the Mac couldn't do this, hence the port mapping there.
    network_mode: host
    ports: !reset []  # drops the base file's 8123:8123 (host networking has no port mapping); Compose 2.24+

  # the tunnel (docker-compose.yml) on the host's network too, with "homeassistant" meaning this machine, so the
  # dashboard's http://homeassistant:8123 works here as it does on the Mac (and the MCP: http://homeassistant:8792)
  cloudflared:
    network_mode: host
    extra_hosts:
      - "homeassistant:127.0.0.1"

  # Jellyfin on the host's network, so the TV's app finds it by itself (a UDP broadcast on 7359), and with the
  # Ryzen's graphics for converting video the TV can't play as it is (VAAPI; turn it on in Jellyfin's Dashboard →
  # Playback → Transcoding: Video Acceleration API, device /dev/dri/renderD128)
  jellyfin:
    network_mode: host
    ports: !reset []
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-0}"  # the render group, which may open /dev/dri (server/setup finds its number)
